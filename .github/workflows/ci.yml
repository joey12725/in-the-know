name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itk
          POSTGRES_PASSWORD: itk
          POSTGRES_DB: itk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itk"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (SQLite)
        run: uv run pytest
      - name: Tests (Postgres) and migration drift check
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://itk:itk@localhost:5432/itk
          TEST_POSTGRES_URL: postgresql://itk:itk@localhost:5432/itk
      - name: Offline demo
        run: |
          uv run python -m itk.cli init-db
          uv run python -m itk.cli seed
          uv run python -m itk.cli run-pipeline

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
