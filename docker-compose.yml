# Local Postgres matching production (Neon). Start with `docker compose up -d db`, then set
# DATABASE_URL=postgresql://itk:itk@localhost:5432/itk in .env and run `make migrate`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: itk
      POSTGRES_PASSWORD: itk
      POSTGRES_DB: itk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itk"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
